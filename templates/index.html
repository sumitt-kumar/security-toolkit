<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Security Toolkit</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #e2e8f0;
           margin: 0; padding: 20px; }
    .box { max-width: 500px; margin: 30px auto; }
    h2 { text-align: center; color: #38bdf8; }
    .card { background: #1e293b; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
    input { width: 70%; padding: 10px; border-radius: 6px; border: none; }
    button { padding: 10px 16px; border: none; border-radius: 6px;
             background: #38bdf8; color: #0f172a; font-weight: bold; cursor: pointer; }
    button:hover { background: #7dd3fc; }
    .result { background: #1e293b; padding: 15px 20px; border-radius: 10px;
              border-left: 4px solid #38bdf8; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Security Toolkit</h2>

    <div class="card">
      <h3>Password Checker</h3>
      <form method="post">
        <input type="password" name="pw" placeholder="Password daalo">
        <button>Check</button>
      </form>
    </div>

    <div class="card">
      <h3>URL Checker</h3>
      <form method="post">
        <input type="text" name="url" placeholder="URL daalo">
        <button>Check</button>
      </form>
    </div>

    {% if result %}
    <div class="result">
      <h3>Result:</h3>
      {% if result is string %}<p>{{ result }}</p>
      {% else %}<ul>{% for r in result %}<li>{{ r }}</li>{% endfor %}</ul>{% endif %}
    </div>
    {% endif %}
  </div>
</body>
</html>
